<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | Inner Compass</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f9f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        .auth-card h2 { color: #195c70; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #195c70; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background: #6bb274; }
        .toggle-link { display: block; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 0.9rem; }
        .toggle-link:hover { color: #195c70; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="auth-card">
        {% if action == 'signup' %}
            <h2>Join the Community</h2>
            <form action="/signup" method="POST">
                <input type="text" name="username" placeholder="Full Name or Username" required>
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="password" name="password" placeholder="Create Password" required>
                <button type="submit">Sign Up</button>
            </form>
            <a href="/login" class="toggle-link">Already have an account? Log in here.</a>
            
        {% else %}
            <h2>Welcome Back</h2>
            <form action="/login" method="POST">
                <input type="email" name="email" placeholder="Email Address" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Log In</button>
            </form>
            <a href="/signup" class="toggle-link">New here? Create an account.</a>
        {% endif %}
        
        <br>
        <a href="/" class="toggle-link" style="color: #195c70; margin-top: 10px;">&larr; Back to Home</a>
    </div>

</body>
</html>
